<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BTMPHYSICSAITUTOR</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BTMPHYSICSAITUTOR">
  <meta name="application-name" content="BTMPHYSICSAITUTOR">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3254/3254099.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0e1117;
      color: #fafafa;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #161b22;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #30363d;
    }
    header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #58a6ff;
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .header-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      cursor: pointer;
      font-weight: 500;
    }
    .header-btn:hover {
      background: #30363d;
    }
    .student-bar {
      background-color: #1f242c;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #30363d;
    }
    .student-bar input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13.5px;
      outline: none;
    }
    .student-bar input:focus {
      border-color: #58a6ff;
    }
    .student-bar input.input-alert {
      border-color: #f85149 !important;
      background-color: #2b1d20 !important;
    }
    .stats-badge {
      font-size: 12px;
      color: #8b949e;
      white-space: nowrap;
    }
    .stats-badge span {
      color: #58a6ff;
      font-weight: 600;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 95%;
    }
    .msg-row.user-row {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-row.bot-row {
      align-self: flex-start;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
      background: #21262d;
      border: 1px solid #30363d;
    }
    .msg-content {
      padding: 12px 15px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
      width: 100%;
    }
    .user-row .msg-content {
      background-color: #1f6feb;
      color: #fff;
      border-bottom-right-radius: 2px;
      font-size: 14.5px;
    }
    .bot-row .msg-content {
      background-color: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-bottom-left-radius: 2px;
    }
    .chat-img-preview {
      max-width: 220px;
      max-height: 220px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: block;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* 텍스트 크기 계층화 디자인 */
    .bot-row .msg-content h1 {
      font-size: 18.5px;
      font-weight: 700;
      color: #58a6ff;
      margin: 12px 0 6px 0;
      line-height: 1.4;
    }
    .bot-row .msg-content h2 {
      font-size: 16.5px;
      font-weight: 700;
      color: #79c0ff;
      margin: 10px 0 5px 0;
      line-height: 1.4;
    }
    .bot-row .msg-content h3 {
      font-size: 15px;
      font-weight: 600;
      color: #d2a8ff;
      margin: 8px 0 4px 0;
      line-height: 1.4;
    }
    .bot-row .msg-content p {
      font-size: 13.5px;
      line-height: 1.7;
      margin-bottom: 6px;
      color: #e6edf3;
    }
    .bot-row .msg-content ul, .bot-row .msg-content ol {
      margin: 4px 0 6px 18px;
      font-size: 13px;
      line-height: 1.65;
    }
    .bot-row .msg-content li {
      margin-bottom: 3px;
    }

    .katex-display {
      margin: 8px 0 !important;
    }

    pre {
      background: #161b22;
      border-radius: 8px;
      padding: 10px;
      margin: 8px 0;
      overflow-x: auto;
      border: 1px solid #30363d;
    }
    code {
      font-family: Consolas, monospace;
      font-size: 12.5px;
    }

    .sim-container {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      margin: 10px 0;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }
    .sim-frame {
      width: 100%;
      height: 420px;
      border: none;
      border-radius: 6px;
      background: #161b22;
      display: block;
      overflow: hidden;
    }
    .sim-toggle-btn {
      background: #238636;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      align-self: flex-start;
    }

    .spinner {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #58a6ff;
      animation: spin 0.8s ease-in-out infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .image-preview-bar {
      display: none;
      background-color: #1f242c;
      padding: 6px 14px;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #30363d;
    }
    .preview-thumbnail {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #58a6ff;
    }
    .preview-info {
      flex: 1;
      font-size: 12px;
      color: #8b949e;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cancel-img-btn {
      background: none;
      border: none;
      color: #f85149;
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
    }

    .input-area {
      background-color: #161b22;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #30363d;
    }
    .file-btn {
      background-color: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .file-btn:hover {
      background-color: #30363d;
    }
    .input-area textarea {
      flex: 1;
      background-color: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      resize: none;
      height: 44px;
      font-size: 14px;
      outline: none;
    }
    .input-area textarea:focus {
      border-color: #58a6ff;
    }
    .input-area button {
      background-color: #238636;
      color: #fff;
      border: none;
      padding: 0 16px;
      height: 44px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .input-area button:disabled {
      background-color: #30363d;
      cursor: not-allowed;
    }

    /* 모달 팝업 스타일 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      width: 90%;
      max-width: 440px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .modal-header h2 {
      font-size: 16px;
      color: #58a6ff;
    }
    .close-btn {
      background: none;
      border: none;
      color: #8b949e;
      font-size: 20px;
      cursor: pointer;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
      margin-bottom: 8px;
      color: #c9d1d9;
    }
    .info-row b {
      color: #f0f6fc;
    }
    .gauge-section {
      margin: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .gauge-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .gauge-label {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: #8b949e;
    }
    .gauge-bar-bg {
      width: 100%;
      height: 8px;
      background: #21262d;
      border-radius: 4px;
      overflow: hidden;
    }
    .gauge-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }
    .fill-blue { background: #1f6feb; }
    .fill-green { background: #238636; }
    .fill-purple { background: #a371f7; }
    .modal-footer {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }
    .modal-btn-primary {
      flex: 1;
      background: #1f6feb;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-btn-secondary {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚛️ BTMPHYSICSAITUTOR</h1>
    <div class="header-actions">
      <button class="header-btn" onclick="openReportModal()">학습 기록</button>
      <button class="header-btn" onclick="openResetModal()">대화 초기화</button>
    </div>
  </header>

  <div class="student-bar">
    <input type="text" id="studentId" placeholder="학번과 이름을 입력하세요 (예: 20101 홍길동)" oninput="clearInputAlert()" onchange="saveStudentId()">
    <div class="stats-badge">
      질문: <span id="qCountDisplay">0</span>회 | 점수: <span id="scoreDisplay">0</span>점
    </div>
  </div>

  <div id="chat-box">
    <div class="msg-row bot-row">
      <div class="avatar">👨‍🏫</div>
      <div class="msg-content">
        <p>안녕하세요. 볼츠만물리 학원의 공식 물리 학습 튜터입니다.</p>
        <p>궁금한 물리 개념을 질문하거나 문제 풀이 및 시뮬레이션을 요청해 주세요. 사진(📷)을 첨부하여 교재 문제나 그래프를 질문하셔도 좋습니다.</p>
      </div>
    </div>
  </div>

  <div class="image-preview-bar" id="imagePreviewBar">
    <img id="previewImg" class="preview-thumbnail" src="" alt="미리보기">
    <span class="preview-info" id="previewFileName">선택된 이미지</span>
    <button class="cancel-img-btn" onclick="clearSelectedImage()">&times;</button>
  </div>

  <div class="input-area">
    <input type="file" id="imageFileInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
    <button class="file-btn" onclick="document.getElementById('imageFileInput').click()" title="사진/이미지 첨부">📷</button>
    <textarea id="questionInput"
