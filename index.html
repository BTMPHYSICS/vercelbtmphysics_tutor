  <style>

    }
    header h1 {

      background-color: #1f242c;

    }
    .student-bar input {
      flex: 1;

      flex: 1;

    .msg-row.bot-row {

    .avatar {

    .msg-content {

    }
    .user-row .msg-content {

    }
    .bot-row .msg-content {
      background-color: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-bottom-left-radius: 2px;
    }
    pre {
      background: #161b22;
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
      overflow-x: auto;
      border: 1px solid #30363d;
    }
    code {
      font-family: monospace;
      font-size: 13px;
    }
    .sim-container {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      margin: 12px 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .sim-frame {
      width: 100%;
      height: 320px;
      border: none;
      border-radius: 6px;
      background: #161b22;
    }
    .sim-toggle-btn {
      background: #238636;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      align-self: flex-start;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #58a6ff;
      animation: spin 0.8s ease-in-out infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .input-area {
      background-color: #161b22;
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #30363d;
    }
    .input-area textarea {
      flex: 1;
      background-color: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      resize: none;
      height: 46px;
      font-size: 14px;
      outline: none;
    }
    .input-area textarea:focus {
      border-color: #58a6ff;
    }
    .input-area button {
      background-color: #238636;
      color: #fff;
      border: none;
      padding: 0 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .input-area button:disabled {
      background-color: #30363d;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚛️ BTMPHYSICSAITUTOR</h1>
    <button class="header-btn" onclick="resetChat()">대화 초기화</button>
  </header>

  <div class="student-bar">
    <label style="font-size: 13px; color: #8b949e; white-space: nowrap;">학생 식별</label>
    <input type="text" id="studentId" placeholder="예: 20101 홍길동 (학번과 이름)" onchange="saveStudentId()">
  </div>

  <div id="chat-box">
    <div class="msg-row bot-row">
      <div class="avatar">👨‍🏫</div>
      <div class="msg-content">안녕하세요. 볼츠만물리 학원의 공식 물리 학습 튜터입니다. 궁금한 물리 개념을 질문하거나, '포물선 운동 시뮬레이션 보여줘', '단진자 운동 시각화해줘'와 같이 요청하시면 화면에서 직접 움직이는 물리 시뮬레이터를 띄워드립니다.</div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="questionInput" placeholder="물리 질문이나 시뮬레이션 요청을 입력하세요..."></textarea>
    <button id="sendBtn" onclick="handleSend()">전송</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    const GEMINI_API_KEY = "AQ.Ab8RN6JIZhw_rcrkysD5Cl-raQWwAtsCjRag7JHn-Fw090ctOQ";
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyh_LWY0ZmWlLIhOP4KOjB9bRSASP9NaSaFNJBqKmE3r8LdtpTZgFrTDGyPzXvSP3dbCQ/exec";

    const SYSTEM_INSTRUCTION = `
당신은 볼츠만물리 학원의 공식 물리 학습 전용 AI 튜터인 btmphysics AI Tutor입니다.

[물리 시뮬레이션 및 시각화 출력 특별 규칙]
1. 사용자가 시각화, 시뮬레이션, 그래프, 인터랙티브 데모, 움직이는 그림을 요청하면 반드시 실시간 실행 가능한 독립형 HTML/JS/Canvas 코드를 아래 포맷으로 작성하세요:
\`\`\`html
<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #161b22; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
  canvas { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; }
  .controls { margin-top: 6px; display: flex; gap: 8px; font-size: 12px; }
  button { background: #238636; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
  <canvas id="simCanvas" width="340" height="230"></canvas>
  <div class="controls">
    <button onclick="resetSim()">다시 시작</button>
  </div>
  <script>
    // 물리 수식 기반 Canvas 2D 애니메이션 코드 작성 (requestAnimationFrame 활용)
  <\/script>
</body>
</html>
\`\`\`

2. 수식 표현: 모든 수학 공식과 물리 수식은 KaTeX 문법으로 작성하세요. (단독 수식: $$수식$$, 인라인 수식: $수식$)
3. 볼츠만 쌤은 학원 원장 선생님을 의미하며, 물리학자 볼츠만은 통계역학 질문 시에만 설명합니다.
4. 문장에 강조용 별표 기호는 사용하지 마세요.
`;

    let chatHistory = [];
    let questionCount = 0;

    window.onload = function() {
      const savedId = localStorage.getItem('btm_student_id');
      if (savedId) {
        document.getElementById('studentId').value = savedId;
      }
    };

    function saveStudentId() {
      const id = document.getElementById('studentId').value.trim();
      localStorage.setItem('btm_student_id', id);
    }

    function renderMathAndCode(element) {
      if (window.renderMathInElement) {
        renderMathInElement(element, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
      element.querySelectorAll('pre code').forEach((el) => {
        hljs.highlightElement(el);
      });
    }

    function parseContent(text) {
      const htmlBlockRegex = /```html\n([\s\S]*?)```/g;
      let match;
      let lastIndex = 0;
      let finalHtml = '';

      while ((match = htmlBlockRegex.exec(text)) !== null) {
        let beforeText = text.substring(lastIndex, match.index);
        finalHtml += parseMarkdownSimple(beforeText);

        const codeContent = match[1];
        const blob = new Blob([codeContent], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);

        finalHtml += `
          <div class="sim-container">
            <button class="sim-toggle-btn" onclick="this.nextElementSibling.src='${blobUrl}'">▶ 실시간 물리 시뮬레이터 재생</button>
            <iframe class="sim-frame" src="${blobUrl}"></iframe>
          </div>
        `;
        lastIndex = htmlBlockRegex.lastIndex;
      }

      finalHtml += parseMarkdownSimple(text.substring(lastIndex));
      return finalHtml;
    }

    function parseMarkdownSimple(text) {
      let parsed = text.replace(/```([a-zA-Z]*)\n([\s\S]*?)```/g, function(match, lang, code) {
        return `<pre><code class="language-${lang}">${code.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>`;
      });
      parsed = parsed.replace(/\n/g, '<br>');
      return parsed;
    }

    function appendMessage(sender, text, isLoading = false) {
      const chatBox = document.getElementById('chat-box');
      const row = document.createElement('div');
      row.className = `msg-row ${sender === 'user' ? 'user-row' : 'bot-row'}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerText = sender === 'user' ? '🧑‍🎓' : '👨‍🏫';

      const content = document.createElement('div');
      content.className = 'msg-content';

      if (isLoading) {
        content.innerHTML = '<span class="spinner"></span>답변 및 시뮬레이터를 생성하고 있습니다...';
      } else {
        content.innerHTML = parseContent(text);
      }

      row.appendChild(avatar);
      row.appendChild(content);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;

      if (!isLoading) {
        renderMathAndCode(content);
      }

      return content;
    }

    function resetChat() {
      if (confirm("대화 기록을 초기화하시겠습니까?")) {
        chatHistory = [];
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = `
          <div class="msg-row bot-row">
            <div class="avatar">👨‍🏫</div>
            <div class="msg-content">안녕하세요. 볼츠만물리 학원의 공식 물리 학습 튜터입니다. 궁금한 물리 개념을 질문하거나 시뮬레이션을 요청해 주세요.</div>
          </div>`;
      }
    }

    async function handleSend() {
      const qInput = document.getElementById('questionInput');
      const studentInput = document.getElementById('studentId');
      const sendBtn = document.getElementById('sendBtn');

      const question = qInput.value.trim();
      const studentName = studentInput.value.trim() || "익명학생";

      if (!question) return;

      saveStudentId();
      appendMessage('user', question);
      qInput.value = '';
      sendBtn.disabled = true;

      const loadingElement = appendMessage('bot', '', true);

      chatHistory.push({ role: "user", parts: [{ text: question }] });
      questionCount++;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`;
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
            contents: chatHistory
          })
        });

        const data = await response.json();

        if (data.error) {
          loadingElement.innerText = "API 오류: " + data.error.message;
          return;
        }

        const botReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "답변을 불러오지 못했습니다.";
        loadingElement.innerHTML = parseContent(botReply);
        renderMathAndCode(loadingElement);

        chatHistory.push({ role: "model", parts: [{ text: botReply }] });

        const lenScore = Math.min(question.length * 2, 40);
        const countScore = Math.min(questionCount * 15, 60);
        const totalScore = Math.min(lenScore + countScore, 100);

        logToGoogleSheet(studentName, question, botReply, totalScore);
      } catch (err) {
        loadingElement.innerText = "통신 오류: " + err.message;
      } finally {
        sendBtn.disabled = false;
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
      }
    }

    function logToGoogleSheet(studentId, question, answer, score) {
      const now = new Date();
      const timeString = now.getFullYear() + "-" + 
                         String(now.getMonth() + 1).padStart(2, '0') + "-" + 
                         String(now.getDate()).padStart(2, '0') + " " + 
                         String(now.getHours()).padStart(2, '0') + ":" + 
                         String(now.getMinutes()).padStart(2, '0') + ":" + 
                         String(now.getSeconds()).padStart(2, '0');

      const payload = {
        일시: timeString,
        학번이름: studentId,
        질문내용: question,
        AI답변요약: answer.substring(0, 150),
        참여도: "100%",
        성실도: "100%",
        점수: score
      };

      fetch(WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(() => {});
    }

    document.getElementById('questionInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });
  </script>
</body>
