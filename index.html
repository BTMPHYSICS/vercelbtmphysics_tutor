<body>

  <header>
    <h1>⚛️ BTMPHYSICS-AI-TUTOR</h1>
    <div class="header-actions">
      <button class="header-btn" onclick="openReportModal()">학습 기록</button>
      <button class="header-btn" onclick="openResetModal()">대화 초기화</button>
    </div>
  </header>

  <div class="student-bar">
    <input type="text" id="studentId" placeholder="학번과 이름을 입력하세요 (예: 20101 홍길동)" oninput="clearInputAlert()" onchange="saveStudentId()">
    <div class="stats-badge">
      질문: <span id="qCountDisplay">0</span>회 | 점수: <span id="scoreDisplay">0</span>점
    </div>
  </div>

  <div id="chat-box">
    <div class="msg-row bot-row">
      <div class="avatar">👨‍🏫</div>
      <div class="msg-wrapper">
        <button class="copy-btn" onclick="copyMessageText(this)">📋 복사</button>
        <div class="msg-content">
          <p>안녕하세요. 볼츠만물리 학원의 공식 물리 학습 튜터입니다.</p>
          <p>궁금한 물리 개념을 질문하거나 문제 풀이 및 시뮬레이션을 요청해 주세요. 사진(📷)을 첨부하여 교재 문제나 그래프를 질문하셔도 좋습니다.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="image-preview-bar" id="imagePreviewBar">
    <img id="previewImg" class="preview-thumbnail" src="" alt="미리보기">
    <span class="preview-info" id="previewFileName">선택된 이미지</span>
    <button class="cancel-img-btn" onclick="clearSelectedImage()">&times;</button>
  </div>

  <div class="input-area">
    <input type="file" id="imageFileInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
    <button class="file-btn" onclick="document.getElementById('imageFileInput').click()" title="사진/이미지 첨부">📷</button>
    <textarea id="questionInput" placeholder="물리 질문을 입력하세요..."></textarea>
    <button id="sendBtn" onclick="handleSend()">전송</button>
  </div>

  <div class="modal-overlay" id="customAlertModal">
    <div class="modal-box" style="max-width: 380px;">
      <div class="modal-header">
        <h2 id="alertTitle">📌 볼츠만물리 알림</h2>
        <button class="close-btn" onclick="closeAlertModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p id="alertMessage" style="font-size: 14px; line-height: 1.6; color: #e6edf3;"></p>
      </div>
      <div class="modal-footer" id="alertFooter">
        <button class="modal-btn-primary" onclick="closeAlertModal()">확인</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="reportModal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>📊 물리 학습 활동 보고서</h2>
        <button class="close-btn" onclick="closeReportModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="info-row">
          <span>학생 정보</span>
          <b id="modalStudentName">-</b>
        </div>
        <div class="info-row">
          <span>총 질문 횟수</span>
          <b id="modalQCount">0 회</b>
        </div>
        <div class="info-row">
          <span>종합 학습 점수</span>
          <b id="modalTotalScore" style="color: #58a6ff; font-size: 15px;">0 점</b>
        </div>

        <div class="gauge-section">
          <div class="gauge-item">
            <div class="gauge-label">
              <span>학습 참여도 (질문 누적 100회 기준)</span>
              <span id="modalParticipationVal">0%</span>
            </div>
            <div class="gauge-bar-bg">
              <div class="gauge-bar-fill fill-blue" id="modalParticipationBar" style="width: 0%;"></div>
            </div>
          </div>

          <div class="gauge-item">
            <div class="gauge-label">
              <span>학습 성실도 (질문 깊이 및 지속성)</span>
              <span id="modalSincerityVal">0%</span>
            </div>
            <div class="gauge-bar-bg">
              <div class="gauge-bar-fill fill-green" id="modalSincerityBar" style="width: 0%;"></div>
            </div>
          </div>

          <div class="gauge-item">
            <div class="gauge-label">
              <span>개념 이해도 (대화 성숙도)</span>
              <span id="modalUnderstandingVal">0%</span>
            </div>
            <div class="gauge-bar-bg">
              <div class="gauge-bar-fill fill-purple" id="modalUnderstandingBar" style="width: 0%;"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn-primary" onclick="exportToNotionMarkdown()">Notion용 MD 파일 다운로드</button>
      </div>
    </div>
  </div>

    const SYSTEM_INSTRUCTION = `
당신은 '볼츠만물리' 학원의 공식 물리 학습 전용 AI 튜터인 'btmphysics AI Tutor'입니다.

    async function loadLectureData() {
      try {
        const listRes = await fetch('/data/list.json');
        if (!listRes.ok) {
          console.warn("[볼츠만물리] /data/list.json 파일을 찾을 수 없습니다. 상태 코드: " + listRes.status);
          return;
        }
        
        const rawJsonText = await listRes.text();
        let fileList;
        try {
          fileList = JSON.parse(rawJsonText);
        } catch (jsonErr) {
          console.error("[볼츠만물리] data/list.json 파일의 JSON 문법 오류입니다. 쉼표(,)나 따옴표를 확인해 주세요:", jsonErr.message);
          return;
        }

        let combinedText = "\n\n[학원 전용 강의 및 동영상 추출 레퍼런스 데이터]\n";
        let loadedCount = 0;

        for (const filePath of fileList) {
          try {
            const cleanPath = filePath.startsWith('/') ? filePath : '/' + filePath;
            const res = await fetch(cleanPath);
            if (res.ok) {
              const mdText = await res.text();
              combinedText += `\n--- 강의 파일: ${cleanPath} ---\n${mdText}\n`;
              loadedCount++;
            } else {
              console.warn(`[볼츠만물리] 강의 파일 로드 실패: ${cleanPath} (상태: ${res.status})`);
            }
          } catch (fileErr) {
            console.error(`[볼츠만물리] 파일 읽기 에러 (${filePath}):`, fileErr);
          }
        }
        lectureKnowledgeBase = combinedText;
        console.log(`%c[볼츠만물리] 강의 데이터 적재 성공: ${loadedCount}개 파일 (총 ${combinedText.length}자)`, "color: #58a6ff; font-weight: bold; font-size: 13px;");
      } catch (err) {
        console.error("[볼츠만물리] 강의 데이터 로드 중 전체 에러:", err);
      }
    }

    function injectKaTeXToSimulation(rawCode, frameId) {

        '      renderMathInElement(document.body, {\n' +
        '        delimiters: [\n' +
        '          {left: "$$", right: "$$", display: true},\n' +
        '          {left: "$", right: "$", display: false}\n' +
        '        ],\n' +
        '        throwOnError: false\n' +
        '      });\n' +

    let simFrameCounter = 0;
    function parseContent(text) {
      let cleanText = text.replace(/^[ \t]*[-=]{3,}[ \t]*$/gm, '');

      const htmlBlockRegex = /```html\n([\s\S]*?)```/g;
      let match;
      let lastIndex = 0;
      let finalHtml = '';

      while ((match = htmlBlockRegex.exec(cleanText)) !== null) {
        let beforeText = cleanText.substring(lastIndex, match.index);
        finalHtml += formatMarkdownText(beforeText);

        const frameId = 'sim_frame_' + (++simFrameCounter);
        const codeContent = match[1];
        const enhancedCode = injectKaTeXToSimulation(codeContent, frameId);
        const blob = new Blob([enhancedCode], { type: 'text/html;charset=utf-8' });
        const blobUrl = URL.createObjectURL(blob);

        finalHtml += `
          <div class="sim-container">
            <button class="sim-toggle-btn" onclick="this.nextElementSibling.src='${blobUrl}'">↻ 인터랙티브 물리 시각화</button>
            <iframe id="${frameId}" class="sim-frame" src="${blobUrl}" scrolling="no"></iframe>
          </div>
        `;
        lastIndex = htmlBlockRegex.lastIndex;
      }

      finalHtml += formatMarkdownText(cleanText.substring(lastIndex));
      return finalHtml;
    }

    function formatMarkdownText(text) {
      if (!text) return '';

      const codeBlocks = [];
      let str = text.replace(/```([a-zA-Z]*)\n([\s\S]*?)```/g, function(match, lang, code) {
        const id = `__CODEBLOCK_${codeBlocks.length}__`;
        codeBlocks.push(`<pre><code class="language-${lang}">${code.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>`);
        return id;
      });

      str = str.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

      const lines = str.split(/\r?\n/);
      let htmlResult = '';
      let inList = false;
      let listType = '';

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        if (!line) {
          if (inList) {
            htmlResult += listType === 'ul' ? '</ul>' : '</ol>';
            inList = false;
          }
          continue;
        }

        if (line.startsWith('__CODEBLOCK_')) {
          if (inList) {
            htmlResult += listType === 'ul' ? '</ul>' : '</ol>';
            inList = false;
          }
          const idx = parseInt(line.replace(/[^0-9]/g, ''));
          htmlResult += codeBlocks[idx] || '';
          continue;
        }

        if (/^###\s+/.test(line)) {
          if (inList) { htmlResult += listType === 'ul' ? '</ul>' : '</ol>'; inList = false; }
          htmlResult += `<h3>${line.replace(/^###\s+/, '')}</h3>`;
        } else if (/^##\s+/.test(line)) {
          if (inList) { htmlResult += listType === 'ul' ? '</ul>' : '</ol>'; inList = false; }
          htmlResult += `<h2>${line.replace(/^##\s+/, '')}</h2>`;
        } else if (/^#\s+/.test(line)) {
          if (inList) { htmlResult += listType === 'ul' ? '</ul>' : '</ol>'; inList = false; }
          htmlResult += `<h1>${line.replace(/^#\s+/, '')}</h1>`;
        } else if (/^[-*]\s+/.test(line)) {
          if (!inList || listType !== 'ul') {
            if (inList) htmlResult += listType === 'ul' ? '</ul>' : '</ol>';
            htmlResult += '<ul>';
            inList = true;
            listType = 'ul';
          }
          htmlResult += `<li>${line.replace(/^[-*]\s+/, '')}</li>`;
        } else if (/^\d+\.\s+/.test(line)) {
          if (!inList || listType !== 'ol') {
            if (inList) htmlResult += listType === 'ul' ? '</ul>' : '</ol>';
            htmlResult += '<ol>';
            inList = true;
            listType = 'ol';
          }
          htmlResult += `<li>${line.replace(/^\d+\.\s+/, '')}</li>`;
        } else {
          if (inList) {
            htmlResult += listType === 'ul' ? '</ul>' : '</ol>';
            inList = false;
          }
          htmlResult += `<p>${line}</p>`;
        }
      }

      if (inList) {
        htmlResult += listType === 'ul' ? '</ul>' : '</ol>';
      }

      return htmlResult;
    }

      content.className = 'msg-content';

      if (imgSrc) {
        const imgEl = document.createElement('img');
        imgEl.src = imgSrc;
        imgEl.className = 'chat-img-preview';
        content.appendChild(imgEl);
      }

      if (isLoading) {
        const span = document.createElement('span');
        span.innerHTML = '<span class="spinner"></span>답변을 준비하고 있습니다...';
        content.appendChild(span);
      } else {
        const textWrapper = document.createElement('div');
        textWrapper.innerHTML = parseContent(text);
        content.appendChild(textWrapper);
      }

      wrapper.appendChild(content);
      row.appendChild(avatar);
      row.appendChild(wrapper);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;

      if (!isLoading) {
        renderMathAndCode(content);
      }

      return { wrapper, content };
    }

    function openResetModal() {
      showAlert("대화 초기화", "지금까지의 대화와 학습 기록을 초기화하시겠습니까?", function() {
        chatHistory = [];
        rawChatLogs = [];
        questionCount = 0;
        currentScore = 0;
        totalInputLength = 0;
        localStorage.removeItem('btm_chat_history');
        localStorage.removeItem('btm_raw_logs');
        localStorage.removeItem('btm_q_count');
        localStorage.removeItem('btm_score');
        localStorage.removeItem('btm_input_len');

        document.getElementById('qCountDisplay').innerText = '0';
        document.getElementById('scoreDisplay').innerText = '0';

        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = `
          <div class="msg-row bot-row">
            <div class="avatar">👨‍🏫</div>
            <div class="msg-wrapper">
              <button class="copy-btn" onclick="copyMessageText(this)">📋 복사</button>
              <div class="msg-content">
                <p>안녕하세요. 볼츠만물리 학원의 공식 물리 학습 튜터입니다.</p>
                <p>궁금한 물리 개념을 질문하거나 문제 풀이 및 시뮬레이션을 요청해 주세요. 사진(📷) 첨부 질문도 환영합니다.</p>
              </div>
            </div>
          </div>`;
      });
    }

    function calculateMetrics() {
      if (questionCount === 0) {
        return { part: 0, sinc: 0, und: 0, score: 0 };
      }

      const part = Math.min(questionCount, 100);

      const avgLen = totalInputLength / questionCount;
      const lenBonus = Math.min(avgLen / 50, 1.0) * 20;
      const countPart = Math.min(questionCount / 100, 1.0) * 80;
      const sinc = Math.min(Math.round(countPart + lenBonus), 100);

      const und = Math.min(Math.round((part * 0.45) + (sinc * 0.45) + (Math.min(questionCount, 100) * 0.1)), 100);

      const score = Math.min(Math.round((part * 0.4) + (sinc * 0.3) + (und * 0.3)), 100);

      return { part, sinc, und, score };
    }

    function openReportModal() {
      const studentInput = document.getElementById('studentId');
      const studentName = studentInput.value.trim() || "미등록 학생";

      const metrics = calculateMetrics();
      participationRate = metrics.part;
      sincerityRate = metrics.sinc;
      understandingRate = metrics.und;
      currentScore = metrics.score;

      document.getElementById('modalStudentName').innerText = studentName;
      document.getElementById('modalQCount').innerText = `${questionCount} 회`;
      document.getElementById('modalTotalScore').innerText = `${currentScore} 점`;

      document.getElementById('modalParticipationVal').innerText = `${participationRate}%`;
      document.getElementById('modalParticipationBar').style.width = `${participationRate}%`;

      document.getElementById('modalSincerityVal').innerText = `${sincerityRate}%`;
      document.getElementById('modalSincerityBar').style.width = `${sincerityRate}%`;

      document.getElementById('modalUnderstandingVal').innerText = `${understandingRate}%`;
      document.getElementById('modalUnderstandingBar').style.width = `${understandingRate}%`;

      document.getElementById('reportModal').style.display = 'flex';
    }

    function closeReportModal() {
      document.getElementById('reportModal').style.display = 'none';
    }

    function exportToNotionMarkdown() {
      const studentName = document.getElementById('studentId').value.trim() || "학생";
      if (rawChatLogs.length === 0) {
        showAlert("알림", "저장할 대화 내역이 없습니다.");
        return;
      }

      const metrics = calculateMetrics();

      let md = `# ⚛️ BTMPHYSICS-AI-TUTOR 학습 활동 보고서\n\n`;
      md += `> 학생 식별: ${studentName}\n`;
      md += `> 학습 일시: ${new Date().toLocaleString()}\n`;
      md += `> 종합 학습 점수: ${metrics.score} / 100 점\n\n`;

      md += `## 📊 학습 성취도 지표 (100회 완주 기준)\n\n`;
      md += `| 항목 | 수치 | 평가 수준 |\n`;
      md += `| :--- | :--- | :--- |\n`;
      md += `| 총 질문 수 | ${questionCount}회 | ${questionCount >= 80 ? '마스터 단계' : (questionCount >= 40 ? '심화 학습 중' : '기초 탐색 중')} |\n`;
      md += `| 학습 참여도 | ${metrics.part}% | ${metrics.part >= 80 ? '최우수 참여' : (metrics.part >= 40 ? '성실 참여' : '학습 시작')} |\n`;
      md += `| 학습 성실도 | ${metrics.sinc}% | ${metrics.sinc >= 80 ? '심화 질문 중심' : '일반 질문'} |\n`;
      md += `| 개념 이해도 | ${metrics.und}% | ${metrics.und >= 80 ? '개념 습득 우수' : '개념 정립 진행 중'} |\n\n`;

      md += `## 💬 상세 질의응답 내역\n\n`;

      rawChatLogs.forEach((item, idx) => {
        if (item.sender === 'user') {
          md += `### 🧑‍🎓 질문 ${Math.floor(idx / 2) + 1}\n\n`;
          if (item.img) md += `(사진 첨부 질문)\n\n`;
          md += `${item.text}\n\n`;
        } else {
          md += `### 👨‍🏫 볼츠만물리 AI 튜터 답변\n\n`;
          md += `${item.text}\n\n`;
        }
      });

      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `물리학습기록_${studentName}_${new Date().toISOString().slice(0,10)}.md`;
      link.click();
      closeReportModal();
    }

    function formatUserFriendlyErrorMessage(errMsg) {
      const msg = String(errMsg || "");
      if (
        msg.includes("high demand") || 
        msg.includes("503") || 
        msg.includes("429") || 
        msg.includes("Resource has been exhausted") ||
        msg.includes("quota") ||
        msg.includes("Overloaded")
      ) {
        return "현재 AI 튜터 이용자가 많아 일시적으로 응답이 지연되고 있습니다. 잠시 후 다시 질문해 주세요.";
      }
      if (msg.includes("Failed to fetch") || msg.includes("NetworkError")) {
        return "인터넷 연결이 불안정합니다. 네트워크 상태를 확인한 후 다시 시도해 주세요.";
      }
      return "답변을 불러오는 중 일시적인 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.";
    }

    async function handleSend() {
      const qInput = document.getElementById('questionInput');
      const studentInput = document.getElementById('studentId');
      const sendBtn = document.getElementById('sendBtn');

      const studentName = studentInput.value.trim();

      if (!studentName) {
        showAlert("학습 시작 안내", "질문을 시작하기 전에 상단에 [학번과 이름]을 먼저 입력해 주세요.");
        studentInput.classList.add('input-alert');
        studentInput.focus();
        return;
      }

      const question = qInput.value.trim();
      if (!question && !selectedImageBase64) return;

      const currentImgBase64 = selectedImageBase64;
      const currentImgMime = selectedImageMime;
      const displayImgSrc = currentImgBase64 ? `data:${currentImgMime};base64,${currentImgBase64}` : null;

      const userParts = [];
      if (currentImgBase64) {
        userParts.push({
          inlineData: {
            mimeType: currentImgMime,
            data: currentImgBase64
          }
        });
      }
      userParts.push({ text: question || "이 이미지의 물리 문제를 분석하고 풀이해 주세요." });

      saveStudentId();
      appendMessageUI('user', question || "(이미지 질문)", false, displayImgSrc);
      rawChatLogs.push({ sender: 'user', text: question || "(이미지 질문)", img: displayImgSrc });

      qInput.value = '';
      qInput.style.height = '44px';
      clearSelectedImage();
      sendBtn.disabled = true;

      const { wrapper: botWrapper, content: botContent } = appendMessageUI('bot', '', true);

      chatHistory.push({ role: "user", parts: userParts });
      questionCount++;
      totalInputLength += (question.length + (currentImgBase64 ? 30 : 0));

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`;
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION + lectureKnowledgeBase }] },
            contents: chatHistory
          })
        });

        const data = await response.json();

        if (data.error) {
          const friendlyMessage = formatUserFriendlyErrorMessage(data.error.message);
          botContent.innerText = friendlyMessage;
          return;
        }

        const botReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "답변을 불러오지 못했습니다.";
        botWrapper.setAttribute('data-raw-text', botReply);

        if (!botWrapper.querySelector('.copy-btn')) {
          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-btn';
          copyBtn.innerHTML = '📋 복사';
          copyBtn.onclick = function() { copyMessageText(this); };
          botWrapper.insertBefore(copyBtn, botContent);
        }

        botContent.innerHTML = parseContent(botReply);
        renderMathAndCode(botContent);

        chatHistory.push({ role: "model", parts: [{ text: botReply }] });
        rawChatLogs.push({ sender: 'bot', text: botReply });

        const metrics = calculateMetrics();
        currentScore = metrics.score;
        participationRate = metrics.part;
        sincerityRate = metrics.sinc;
        understandingRate = metrics.und;

        document.getElementById('qCountDisplay').innerText = questionCount;
        document.getElementById('scoreDisplay').innerText = currentScore;

        saveLocalHistory();
        logToGoogleSheet(studentName, question || "(이미지 질문)", botReply, currentScore);
      } catch (err) {
        const friendlyMessage = formatUserFriendlyErrorMessage(err.message);
        botContent.innerText = friendlyMessage;
      } finally {
        sendBtn.disabled = false;
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
      }
    }

    function logToGoogleSheet(studentId, question, answer, score) {
      const now = new Date();
      const timeString = now.getFullYear() + "-" + 
                         String(now.getMonth() + 1).padStart(2, '0') + "-" + 
                         String(now.getDate()).padStart(2, '0') + " " + 
                         String(now.getHours()).padStart(2, '0') + ":" + 
                         String(now.getMinutes()).padStart(2, '0') + ":" + 
                         String(now.getSeconds()).padStart(2, '0');

      const metrics = calculateMetrics();

      const payload = {
        일시: timeString,
        학번이름: studentId,
        질문내용: question,
        AI답변요약: answer.substring(0, 150),
        참여도: `${metrics.part}%`,
        성실도: `${metrics.sinc}%`,
        점수: score
      };

      fetch(WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(() => {});
    }

    const isMobileDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    const questionTextarea = document.getElementById('questionInput');

    questionTextarea.addEventListener('input', function() {
      this.style.height = '44px';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    questionTextarea.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        if (isMobileDevice) {
          return;
        } else {
          if (!e.shiftKey) {
            e.preventDefault();
            handleSend();
          }
        }
      }
    });
  </script>
